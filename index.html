<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Shelf</title>
<meta name="description" content="복사해서 바로 쓰는 웹 모션·UI 요소 모음과 레퍼런스 사이트 정리">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23221934'/%3E%3Cpath d='M20 70 Q50 10 80 70' stroke='%238fe3d0' stroke-width='10' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--bg:#14101f;--card:#1d1729;--line:#2e2642;--text:#f2eefc;--muted:#a59bc2;--accent:#8fe3d0;--accent2:#b39cff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;line-height:1.6}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{padding:64px 0 24px}
header h1{font-size:clamp(36px,7vw,64px);line-height:1.05;margin:0 0 12px;letter-spacing:-.03em}
header h1 em{font-style:normal;color:var(--accent)}
header p{color:var(--muted);margin:0 0 28px;max-width:640px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5;padding:12px 0;background:var(--bg)}
.tools input{flex:1 1 220px;min-width:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#14101f;font-weight:700}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.preview{position:relative;height:200px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#251d36,#17121f 70%);border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta h3{margin:0;font-size:16px}
.tag{font:500 11px "JetBrains Mono",monospace;color:var(--accent2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap}
.desc{margin:0;color:var(--muted);font-size:14px;flex:1}
.actions{display:flex;gap:6px}
.actions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#241d33;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.actions button:hover{border-color:var(--accent)}
pre{margin:0;max-height:320px;overflow:auto;padding:14px;background:#0f0c17;border-radius:10px;font:12px/1.55 "JetBrains Mono",monospace;color:#d9d2ee;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:40px 0}
section h2{font-size:28px;margin:32px 0 6px}
section > p{color:var(--muted);margin:0 0 20px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.refs div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.refs h3{margin:0 0 10px;font-size:15px;color:var(--accent)}
.refs ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{font-size:14px;color:var(--muted)}
.refs li a{font-weight:700;color:var(--text);text-decoration:none;margin-right:6px}
.refs li a:hover{color:var(--accent)}
footer{padding:48px 0;color:var(--muted);font-size:14px;text-align:center}
</style>
<style id="demo-css"></style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Motion <em>Shelf</em></h1>
    <p>페이지 만들 때 꺼내 쓰는 모션·UI 요소 서랍. 대부분 순수 CSS이고, 필요한 것만 몇 줄의 JS를 씁니다. 미리보기를 만져 보고 <b>복사</b>를 누르면 HTML·CSS·JS가 통째로 복사돼요.</p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="검색: 버튼, 로딩, 스크롤…" aria-label="데모 검색">
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
  <main id="grid"></main>

  <section id="refs">
    <h2>레퍼런스 서랍</h2>
    <p>더 찾아볼 때 들르는 곳들. 영감 → 복붙 → 라이브러리 → 도구 순서로 정리했어요.</p>
    <div class="refs" id="refList"></div>
  </section>

  <footer>made for <a href="https://oddz.click">oddz.click</a> · 모든 데모 코드는 자유롭게 가져다 쓰세요</footer>
</div>

<script>
// 데모 하나 = { name, cat, desc, html, css, js? }. js(root)는 미리보기 요소를 받아 이벤트를 붙인다.
const D = [
  // ── 버튼 ──
  { name: '글로우 버튼', cat: '버튼', desc: '호버하면 살짝 떠오르며 빛이 번집니다.',
    html: `<button class="m-glow">Hover me</button>`,
    css: `.m-glow{padding:14px 28px;border:0;border-radius:12px;background:#8fe3d0;color:#14101f;font-weight:700;cursor:pointer;transition:box-shadow .3s,transform .3s}
.m-glow:hover{transform:translateY(-2px);box-shadow:0 0 0 4px rgba(143,227,208,.25),0 10px 30px rgba(143,227,208,.45)}` },

  { name: '슬라이드 채우기', cat: '버튼', desc: '배경이 왼쪽에서 차오르고, 나갈 땐 오른쪽으로 빠집니다.',
    html: `<button class="m-fill">Fill me</button>`,
    css: `.m-fill{position:relative;isolation:isolate;overflow:hidden;padding:14px 28px;border:2px solid #b39cff;border-radius:12px;background:none;color:#b39cff;font-weight:700;cursor:pointer;transition:color .35s}
.m-fill::before{content:"";position:absolute;inset:0;z-index:-1;background:#b39cff;transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.7,0,.3,1)}
.m-fill:hover{color:#14101f}
.m-fill:hover::before{transform:scaleX(1);transform-origin:left}` },

  { name: '마그네틱 버튼', cat: '버튼', desc: '커서 쪽으로 버튼이 끌려옵니다. 미리보기 영역 아무 데나 움직여 보세요.',
    html: `<button class="m-magnet">Magnetic</button>`,
    css: `.m-magnet{padding:16px 32px;border:0;border-radius:999px;background:#f2eefc;color:#14101f;font-weight:700;cursor:pointer;transition:transform .25s ease-out}`,
    js: root => {
      const b = root.querySelector('.m-magnet');
      root.addEventListener('mousemove', e => {
        const r = b.getBoundingClientRect();
        const x = e.clientX - (r.left + r.width / 2);
        const y = e.clientY - (r.top + r.height / 2);
        b.style.transform = `translate(${x * 0.25}px, ${y * 0.35}px)`;
      });
      root.addEventListener('mouseleave', () => b.style.transform = '');
    } },

  { name: '리플 클릭', cat: '버튼', desc: '클릭한 지점에서 물결이 퍼집니다 (머티리얼 스타일).',
    html: `<button class="m-ripple">Click me</button>`,
    css: `.m-ripple{position:relative;overflow:hidden;padding:14px 28px;border:0;border-radius:12px;background:#6c4bd8;color:#fff;font-weight:700;cursor:pointer}
.m-ripple span{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:m-ripple .6s linear;pointer-events:none}
@keyframes m-ripple{to{transform:scale(4);opacity:0}}`,
    js: root => root.querySelector('.m-ripple').addEventListener('click', e => {
      const b = e.currentTarget, r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const dot = document.createElement('span');
      dot.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
      b.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
    }) },

  { name: '자라나는 밑줄', cat: '버튼', desc: '링크 밑줄이 가운데에서 양옆으로 자랍니다. background-size 트릭.',
    html: `<a class="m-underline" href="#">밑줄이 자라나는 링크</a>`,
    css: `.m-underline{color:#f2eefc;font-size:20px;text-decoration:none;padding-bottom:4px;background:linear-gradient(#8fe3d0,#8fe3d0) center bottom/0 2px no-repeat;transition:background-size .3s}
.m-underline:hover{background-size:100% 2px}` },

  // ── 로딩 ──
  { name: '점 세 개', cat: '로딩', desc: '딜레이만 다르게 준 가장 흔한 로더.',
    html: `<div class="m-dots"><i></i><i></i><i></i></div>`,
    css: `.m-dots{display:flex;gap:8px}
.m-dots i{width:12px;height:12px;border-radius:50%;background:#8fe3d0;animation:m-bounce .6s ease-in-out infinite alternate}
.m-dots i:nth-child(2){animation-delay:.2s}
.m-dots i:nth-child(3){animation-delay:.4s}
@keyframes m-bounce{from{transform:translateY(6px);opacity:.4}to{transform:translateY(-6px);opacity:1}}` },

  { name: '링 스피너', cat: '로딩', desc: 'border 한 변만 색을 바꿔 돌리는 한 줄짜리 스피너.',
    html: `<div class="m-spin" role="status" aria-label="로딩 중"></div>`,
    css: `.m-spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(179,156,255,.2);border-top-color:#b39cff;animation:m-rot .8s linear infinite}
@keyframes m-rot{to{transform:rotate(360deg)}}` },

  { name: '스켈레톤 시머', cat: '로딩', desc: '콘텐츠 자리를 먼저 보여주는 로딩. 체감 속도가 빨라집니다.',
    html: `<div class="m-skel"><div class="m-skel-av"></div><div class="m-skel-lines"><div></div><div></div></div></div>`,
    css: `.m-skel{display:flex;gap:12px;width:240px}
.m-skel-av,.m-skel-lines div{background:linear-gradient(90deg,#2a2340 25%,#3b3258 50%,#2a2340 75%) 0 0/200% 100%;animation:m-shimmer 1.4s linear infinite}
.m-skel-av{width:48px;height:48px;border-radius:50%;flex:none}
.m-skel-lines{flex:1;display:grid;gap:8px;align-content:center}
.m-skel-lines div{height:12px;border-radius:6px}
.m-skel-lines div:last-child{width:60%}
@keyframes m-shimmer{to{background-position:-200% 0}}` },

  { name: '무한 진행 바', cat: '로딩', desc: '끝을 모를 때 쓰는 indeterminate 프로그레스 바.',
    html: `<div class="m-bar"></div>`,
    css: `.m-bar{width:220px;height:6px;border-radius:3px;background:rgba(143,227,208,.15);overflow:hidden}
.m-bar::after{content:"";display:block;width:40%;height:100%;border-radius:3px;background:#8fe3d0;animation:m-slide 1.2s ease-in-out infinite}
@keyframes m-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}` },

  // ── 텍스트 ──
  { name: '타이핑 커서', cat: '텍스트', desc: 'steps()로 한 글자씩. 글자 수만큼 steps(N), width:Nch로 맞추세요.',
    html: `<p class="m-type">Hello, oddz.</p>`,
    css: `.m-type{margin:0;font:500 22px "JetBrains Mono",monospace;color:#f2eefc;width:12ch;white-space:nowrap;overflow:hidden;border-right:2px solid #8fe3d0;animation:m-typing 2s steps(12) infinite alternate,m-caret .5s step-end infinite}
@keyframes m-typing{from{width:0}}
@keyframes m-caret{50%{border-color:transparent}}` },

  { name: '흐르는 그라디언트', cat: '텍스트', desc: 'background-clip:text 위에서 그라디언트가 계속 흐릅니다.',
    html: `<p class="m-grad">Gradient Flow</p>`,
    css: `.m-grad{margin:0;font-size:34px;font-weight:800;background:linear-gradient(90deg,#8fe3d0,#b39cff,#ff9ecd,#8fe3d0) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:m-flow 4s linear infinite}
@keyframes m-flow{to{background-position:200% 0}}` },

  { name: '글자 순차 등장', cat: '텍스트', desc: '각 글자에 --i 인덱스를 주고 delay를 계산하는 스태거.',
    html: `<p class="m-stagger"><span style="--i:0">M</span><span style="--i:1">O</span><span style="--i:2">T</span><span style="--i:3">I</span><span style="--i:4">O</span><span style="--i:5">N</span></p>`,
    css: `.m-stagger{margin:0;display:flex;gap:2px;font-size:40px;font-weight:800;color:#f2eefc}
.m-stagger span{display:inline-block;animation:m-rise .6s cubic-bezier(.2,.8,.2,1.2) both;animation-delay:calc(var(--i) * 80ms)}
@keyframes m-rise{from{opacity:0;transform:translateY(24px) rotate(8deg)}}` },

  { name: '글리치', cat: '텍스트', desc: '::before/::after 복제본을 clip-path로 잘라 흔듭니다.',
    html: `<p class="m-glitch" data-text="GLITCH">GLITCH</p>`,
    css: `.m-glitch{position:relative;margin:0;font:800 40px/1 "JetBrains Mono",monospace;color:#f2eefc}
.m-glitch::before,.m-glitch::after{content:attr(data-text);position:absolute;inset:0}
.m-glitch::before{color:#ff4f9a;animation:m-g1 2s infinite steps(1)}
.m-glitch::after{color:#4fe3ff;animation:m-g2 2s infinite steps(1)}
@keyframes m-g1{0%,100%{clip-path:inset(0 0 100% 0)}10%{clip-path:inset(10% 0 60% 0);transform:translate(-3px)}20%{clip-path:inset(50% 0 20% 0);transform:translate(3px)}30%{clip-path:inset(0 0 100% 0)}}
@keyframes m-g2{0%,100%{clip-path:inset(0 0 100% 0)}15%{clip-path:inset(70% 0 5% 0);transform:translate(3px)}25%{clip-path:inset(30% 0 40% 0);transform:translate(-3px)}35%{clip-path:inset(0 0 100% 0)}}` },

  { name: '숫자 카운트업', cat: '텍스트', desc: '@property로 정수를 애니메이션하고 counter()로 출력. JS 없음.',
    html: `<div class="m-count"></div>`,
    css: `@property --m-n{syntax:"<integer>";initial-value:0;inherits:false}
.m-count{font:800 48px "JetBrains Mono",monospace;color:#8fe3d0;counter-reset:n var(--m-n);animation:m-cnt 2s cubic-bezier(.2,.8,.2,1) forwards}
.m-count::after{content:counter(n)}
@keyframes m-cnt{to{--m-n:2026}}` },

  // ── 카드 ──
  { name: '3D 틸트 카드', cat: '카드', desc: '마우스 위치에 따라 카드가 기울어집니다.',
    html: `<div class="m-tilt"><b>3D Tilt</b><small>마우스를 올려 보세요</small></div>`,
    css: `.m-tilt{width:200px;height:130px;border-radius:16px;display:grid;place-content:center;gap:4px;text-align:center;color:#14101f;background:linear-gradient(135deg,#8fe3d0,#b39cff);transform:perspective(600px);transition:transform .15s ease-out}`,
    js: root => {
      const c = root.querySelector('.m-tilt');
      c.addEventListener('mousemove', e => {
        const r = c.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        c.style.transform = `perspective(600px) rotateX(${-y * 20}deg) rotateY(${x * 20}deg) scale(1.04)`;
      });
      c.addEventListener('mouseleave', () => c.style.transform = '');
    } },

  { name: '카드 뒤집기', cat: '카드', desc: 'preserve-3d + backface-visibility로 앞뒤 면 만들기.',
    html: `<div class="m-flip"><div class="m-flip-in"><div>앞면</div><div>뒷면 ✦</div></div></div>`,
    css: `.m-flip{width:180px;height:120px;perspective:800px}
.m-flip-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1)}
.m-flip:hover .m-flip-in{transform:rotateY(180deg)}
.m-flip-in div{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;font-weight:700;backface-visibility:hidden}
.m-flip-in div:first-child{background:#2a2340;color:#f2eefc;border:1px solid #3b3258}
.m-flip-in div:last-child{background:#ff9ecd;color:#14101f;transform:rotateY(180deg)}` },

  { name: '회전 보더', cat: '카드', desc: '@property 각도를 돌리는 conic-gradient 테두리.',
    html: `<div class="m-border"><div>Rotating border</div></div>`,
    css: `@property --m-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.m-border{width:200px;height:120px;padding:2px;border-radius:16px;background:conic-gradient(from var(--m-angle),#8fe3d0,#b39cff,#ff9ecd,#8fe3d0);animation:m-turn 3s linear infinite}
.m-border div{height:100%;border-radius:14px;background:#17121f;display:grid;place-items:center;color:#f2eefc;font-weight:700}
@keyframes m-turn{to{--m-angle:360deg}}` },

  { name: '글래스모피즘', cat: '카드', desc: 'backdrop-filter 블러 유리 카드. 뒤에 움직이는 색이 있어야 살아납니다.',
    html: `<div class="m-glass-wrap"><i></i><i></i><div class="m-glass">Glass</div></div>`,
    css: `.m-glass-wrap{position:relative;width:240px;height:150px;display:grid;place-items:center}
.m-glass-wrap i{position:absolute;width:90px;height:90px;border-radius:50%;animation:m-float 4s ease-in-out infinite alternate}
.m-glass-wrap i:first-child{top:0;left:20px;background:#ff9ecd}
.m-glass-wrap i:nth-child(2){bottom:0;right:20px;background:#8fe3d0;animation-delay:-2s}
.m-glass{position:relative;width:180px;height:100px;display:grid;place-items:center;border-radius:16px;color:#fff;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@keyframes m-float{to{transform:translate(20px,-14px)}}` },

  // ── 인터랙션 ──
  { name: '토글 스위치', cat: '인터랙션', desc: '체크박스 + 형제 선택자. 오버슈트 이징으로 톡 튀게.',
    html: `<label class="m-toggle"><input type="checkbox" aria-label="토글"><span></span></label>`,
    css: `.m-toggle input{position:absolute;opacity:0}
.m-toggle span{position:relative;display:block;width:56px;height:30px;border-radius:15px;background:#3b3258;cursor:pointer;transition:background .3s}
.m-toggle span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.3,1.5,.6,1)}
.m-toggle input:checked+span{background:#8fe3d0}
.m-toggle input:checked+span::after{transform:translateX(26px)}
.m-toggle input:focus-visible+span{outline:2px solid #b39cff;outline-offset:3px}` },

  { name: '좋아요 팝', cat: '인터랙션', desc: 'aria-pressed 상태로 스타일과 접근성을 동시에.',
    html: `<button class="m-heart" aria-label="좋아요" aria-pressed="false">♥</button>`,
    css: `.m-heart{border:0;background:none;font-size:48px;line-height:1;color:#4a4060;cursor:pointer;transition:color .2s}
.m-heart[aria-pressed="true"]{color:#ff4f7b;animation:m-pop .45s cubic-bezier(.3,1.6,.5,1)}

const $ = s => document.querySelector(s);
const grid = $('#grid');
$('#demo-css').textContent = D.map(d => d.css).join('\n');

const codeOf = d => `<!-- HTML -->\n${d.html}\n\n/* CSS */\n${d.css}` +
  (d.js ? `\n\n// JS\n(${d.js})(document.body);` : '');
const mount = (el, d) => { el.innerHTML = d.html; d.js?.(el); };

D.forEach(d => {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.cat = d.cat;
  card.dataset.search = `${d.name} ${d.cat} ${d.desc}`.toLowerCase();
  card.innerHTML = `<div class="preview"></div>
    <div class="body">
      <div class="meta"><h3></h3><span class="tag"></span></div>
      <p class="desc"></p>
      <div class="actions"><button data-a="replay">↻ 다시</button><button data-a="code" aria-expanded="false">코드</button><button data-a="copy">복사</button></div>
      <pre hidden><code></code></pre>
    </div>`;
  card.querySelector('h3').textContent = d.name;
  card.querySelector('.tag').textContent = d.cat;
  card.querySelector('.desc').textContent = d.desc;
  card.querySelector('code').textContent = codeOf(d);
  const preview = card.querySelector('.preview');
  mount(preview, d);

  card.querySelector('.actions').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.a === 'replay') mount(preview, d);
    if (btn.dataset.a === 'code') {
      const pre = card.querySelector('pre');
      pre.hidden = !pre.hidden;
      btn.setAttribute('aria-expanded', !pre.hidden);
    }
    if (btn.dataset.a === 'copy') {
      navigator.clipboard.writeText(codeOf(d)).then(
        () => { btn.textContent = '복사됨 ✓'; setTimeout(() => btn.textContent = '복사', 1200); },
        () => { btn.textContent = '실패 — 코드 보기에서 복사'; });
    }
  });
  grid.appendChild(card);
});

// 데모 안의 링크가 페이지를 이동시키지 않도록
grid.addEventListener('click', e => { if (e.target.closest('.preview a')) e.preventDefault(); });

// 필터: 카테고리 칩 + 검색
const cats = ['전체', ...new Set(D.map(d => d.cat))];
let cat = '전체';
const empty = document.createElement('p');
empty.className = 'empty';
empty.textContent = '찾는 게 없어요. 아래 레퍼런스 서랍을 뒤져 보세요!';
function filter() {
  const q = $('#q').value.trim().toLowerCase();
  let shown = 0;
  grid.querySelectorAll('.card').forEach(c => {
    c.hidden = !((cat === '전체' || c.dataset.cat === cat) && c.dataset.search.includes(q));
    if (!c.hidden) shown++;
  });
  shown ? empty.remove() : grid.appendChild(empty);
}
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = c;
  b.setAttribute('aria-pressed', c === cat);
  b.onclick = () => {
    cat = c;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    filter();
  };
  $('#chips').appendChild(b);
});
$('#q').addEventListener('input', filter);

// 레퍼런스
$('#refList').innerHTML = REFS.map(([title, items]) =>
  `<div><h3>${title}</h3><ul>${items.map(([n, url, note]) =>
    `<li><a href="${url}" target="_blank" rel="noopener">${n} ↗</a>${note}</li>`).join('')}</ul></div>`).join('');
</script>
